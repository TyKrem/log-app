<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日志中心 · log.tykrem.top</title>
  <link rel="stylesheet" href="/css/style.css?v=20261003-blue">
</head>
<body>
  <div id="gate-view" class="login-view">
    <div class="login-card">
      <div class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></div>
      <h1>日志中心</h1>
      <p>请先登录管理会话，登录后自动返回日志中心，有效期 7 天。</p>
      <p id="gate-error" class="login-error hidden"></p>
      <a id="login-link" href="https://tykrem.top/auth/">登录后返回日志中心</a>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>日志中心</div>
      <div class="topbar-actions">
        <span class="updated" id="updated"></span>
        <a href="https://tykrem.top/">服务器监控</a>
        <button id="private-btn" type="button">私密条目</button>
        <button id="lock-btn" type="button">退出</button>
      </div>
    </header>

    <main class="container">
      <div class="page-head"><p class="eyebrow">运行记录</p><h1>日志中心</h1><p>筛选来源与时间，快速找到需要关注的记录。</p></div>
      <section class="filter-bar">
        <label>来源
          <select id="source"><option value="">全部</option></select>
        </label>
        <label>级别
          <select id="level">
            <option value="">全部</option>
            <option>debug</option>
            <option>info</option>
            <option>warn</option>
            <option>error</option>
          </select>
        </label>
        <label class="wide">搜索
          <input id="q" type="search" placeholder="消息内容 / 元数据关键字">
        </label>
        <label>开始
          <input id="from" type="date">
        </label>
        <label>结束
          <input id="to" type="date">
        </label>
        <div class="filter-actions">
          <button id="query-btn" type="button">查询</button>
          <button id="reset-btn" type="button" class="ghost">重置</button>
          <label class="live"><input id="live" type="checkbox" checked> 自动刷新</label>
        </div>
      </section>

      <div class="result-head">
        <span id="summary">共 0 条日志</span>
        <button id="prev" type="button" class="ghost">上一页</button>
        <span id="page-no">第 1 / 1 页</span>
        <button id="next" type="button" class="ghost">下一页</button>
      </div>

      <section id="log-list" class="log-list">
        <div class="empty">暂无日志</div>
      </section>
    </main>
  </div>

  <div id="private-view" class="private-view hidden" role="dialog" aria-modal="true" aria-labelledby="private-title">
    <div class="private-card">
      <div class="private-head">
        <span id="private-title">私密条目</span>
        <button id="private-close" type="button" class="ghost">关闭</button>
      </div>

      <p class="private-hint">个人记录仅在此处显示，不会混入普通运行日志。</p>
      <p id="private-error" class="login-error hidden"></p>

      <div id="private-body">
        <form id="private-note-form" class="private-note">
          <textarea id="private-note" rows="3" placeholder="记一条私密记录（支持多行），保存后只在这里可见"></textarea>
          <div class="private-note-actions">
            <span id="private-status" class="updated"></span>
            <button type="submit">保存</button>
            <button id="private-refresh" type="button" class="ghost">刷新</button>
          </div>
        </form>
        <div id="private-list" class="log-list"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/js/app.js?v=20261003-blue"></script>
</body>
</html>
